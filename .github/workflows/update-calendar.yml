name: Update LGCC Calendar

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Google Calendar ICS
        run: |
          mkdir -p calendar
          curl -L "https://calendar.google.com/calendar/ical/ldrpzl3672%40gmail.com/public/basic.ics" -o calendar/events.ics

      - name: Commit Updated Calendar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add calendar/events.ics

          git diff --cached --quiet || git commit -m "Update calendar feed"

          git push
