<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Memorial Day Scramble Results — LGCC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0b1210;--card:rgba(255,255,255,0.06);--text:rgba(255,255,255,0.92);--muted:rgba(255,255,255,0.65);--faint:rgba(255,255,255,0.40);--line:rgba(255,255,255,0.12);--gold:#b89b5e;--green-accent:#6ee7b7;--radius:16px;--serif:"Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,Arial,sans-serif;}
    *,*::before,*::after{box-sizing:border-box}html{background:#000}
    body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
    .page-shell{max-width:860px;margin:0 auto;padding:0 20px 60px}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:36px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
    .brand-mark{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);overflow:hidden;display:grid;place-items:center}
    .brand-mark img{width:110%;height:110%;object-fit:contain}
    .brand-text{display:flex;flex-direction:column;line-height:1.15}
    .brand-name{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--text)}
    .brand-tag{font-size:11px;color:var(--muted)}
    .back-btn,.photo-btn{padding:9px 16px;border-radius:999px;border:1px solid rgba(184,155,94,0.35);background:rgba(184,155,94,0.10);color:var(--gold);font-size:13px;font-weight:600;text-decoration:none}
    .event-hero{margin-bottom:28px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
    .event-title{font-family:var(--serif);font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;margin:0 0 8px}
    .event-meta{font-size:14px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px}
    .summary-card{display:flex;flex-wrap:wrap;gap:16px 32px;margin-bottom:20px}
    .photo-card{margin-bottom:20px;text-align:center}
    .photo-card p{margin:0 0 14px;color:var(--muted);font-size:14px}
    .photo-btn{display:inline-block}
    .stat-item{display:flex;flex-direction:column;gap:2px}.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--faint)}.stat-value{font-size:22px;font-weight:700}.stat-value.gold{color:var(--gold)}
    .section-card{margin-bottom:20px;padding:0;overflow:hidden}.section-header{padding:16px 22px;border-bottom:1px solid var(--line)}
    h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;font-size:14px}
    thead tr{background:rgba(255,255,255,0.04);border-bottom:1px solid var(--line)}
    th{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);text-align:left;white-space:nowrap}
    td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.06);vertical-align:middle}
    tbody tr:last-child td{border-bottom:none}.winner-row td{background:rgba(184,155,94,0.08)}
    .col-place{color:var(--muted);font-weight:600;white-space:nowrap}.col-name{font-weight:600;min-width:220px}.col-num{text-align:center;white-space:nowrap}.col-bold{font-weight:700;color:var(--green-accent)}.col-payout{font-weight:700;color:var(--gold)}
    .note{color:var(--muted);font-size:13px;padding:14px 22px;border-top:1px solid var(--line)}
    .site-footer{text-align:center;padding-top:28px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
    @media(max-width:540px){.top-bar{flex-direction:column;align-items:flex-start;gap:12px}.card{padding:16px}.section-header{padding:14px 16px}th,td{padding:9px 10px}}
  </style>
</head>
<body>
<div class="page-shell">
  <nav class="top-bar">
    <a class="brand" href="../index.html">
      <div class="brand-mark"><img src="../assets/logo.png" alt="LGCC" onerror="this.style.display='none'"/></div>
      <div class="brand-text"><span class="brand-name">Lebanon Golf &amp; Country Club</span><span class="brand-tag">Est. 1951</span></div>
    </a>
    <a class="back-btn" href="../index.html#results">All Results</a>
  </nav>

  <div style="width:100%;max-height:260px;overflow:hidden;border-radius:var(--radius);margin-bottom:24px">
    <img src="../assets/MemScrambleFullResultsBanner.png" alt="Memorial Day Scramble banner" style="width:100%;object-fit:cover;max-height:260px" />
  </div>

  <div class="event-hero">
    <p class="eyebrow">Scramble &nbsp;·&nbsp; Club Results</p>
    <h1 class="event-title">Memorial Day Scramble</h1>
    <div class="event-meta">May 25, 2026</div>
  </div>

  <div class="card summary-card">
    <div class="stat-item"><span class="stat-label">Teams</span><span class="stat-value">18</span></div>
    <div class="stat-item"><span class="stat-label">Flights</span><span class="stat-value">3</span></div>
    <div class="stat-item"><span class="stat-label">Scoring</span><span class="stat-value gold">Manual</span></div>
  </div>

  <div class="card photo-card">
    <p>Member photos from the Memorial Day Scramble are available in a separate gallery.</p>
    <a class="photo-btn" href="../photos/memorial-day-scramble-2026.html">View Member Photo Gallery</a>
  </div>
